{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Transaction</title>
    <link rel="stylesheet" href="{% static 'nexora/css/monetra.css' %}">
    <script src="{% static 'nexora/js/monetra.js' %}" defer></script>
</head>
<body>
    
     <div class="valid">
        <form method="POST" action="{% url 'confirm' %}">
        {% csrf_token %}

        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="amount" value="{{ amount }}">
        <input type="hidden" name="transaction_type" value="{{ transaction_type }}">
        <input type="hidden" name="currency" value="{{ currency }}">
        <input type="hidden" name="category" value="{{ category }}">
        <input type="hidden" name="description" value="{{ description }}">
        <input type="hidden" name="confirmation_token" value="{{ confirmation_token }}">
        <input type="hidden" name="confirm" value="yes">

        
    <p>
       {{ request.user.username }} are you sure you wan to make this transacation?
    </p>
    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
    <button type="submit">
        Pay
    </button>
    </form>
    </div>
</body>
</html>
